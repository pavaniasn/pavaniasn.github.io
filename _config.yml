title: Pavani Ayinampudi
description: Learning Innovation and Process Architecture — research, teaching, and writing.
url: "https://pavaniasn.github.io"

# Each piece of writing lives as its own file in _mananam/
# Filenames are dated so the folder stays in order; the URL uses the `slug`
# from the file's front matter, e.g. /mananam/summer-i-turned-teacher/
collections:
  mananam:
    output: true
    permalink: /mananam/:title/

defaults:
  - scope:
      path: ""
      type: mananam
    values:
      layout: mananam

# Keeps the old /manan/... URLs working after the rename to Mananam.
plugins:
  - jekyll-redirect-from

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
