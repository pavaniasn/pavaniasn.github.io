<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Pavani Ayinampudi</title>
  <meta name="description" content="{{ page.summary | default: page.title }}" />
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="brand" href="{{ '/index.html' | relative_url }}">Pavani Ayinampudi</a>

    </ul>

</nav>

<main>
  <div class="container">

    <article class="post-full">
      <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>

      <div class="post-body">
        {{ content }}
      </div>

    <div class="post-back">
      <a href="{{ '/writing.html' | relative_url }}">← All writing</a>
    </div>

  </div>
</main>

<footer>
